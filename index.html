<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Lagos Afternoon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9c5a8;font-family:Arial,sans-serif}canvas{width:100%;height:100%;display:block}
.hint{position:fixed;bottom:14px;right:16px;background:#fff8ebdf;padding:9px 12px;border-radius:9px;font-size:12px;color:#493627}
</style></head><body>
<div class="hint">Drag to look around · Scroll to zoom</div><canvas id="scene"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const canvas=document.querySelector('#scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9c5a8');scene.fog=new THREE.Fog('#d9c5a8',14,30);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(7.8,6.5,9.5);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.4,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=6;controls.maxDistance=17;
scene.add(new THREE.HemisphereLight('#fff1d6','#806044',2));const sun=new THREE.DirectionalLight('#fff0d4',3);sun.position.set(-5,9,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const M=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function box(w,h,d,ma,x,y,z,rx=0,ry=0,rz=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);o.position.set(x,y,z);o.rotation.set(rx,ry,rz);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function cyl(rt,rb,h,ma,x,y,z,n=32){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),ma);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function ball(r,ma,x,y,z,sx=1,sy=1,sz=1){let o=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),ma);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;scene.add(o);return o}
const wall=M('#d7b58b'),cream=M('#e8d7b9'),wood=M('#875332'),oak=M('#b57a4b'),dark=M('#34271e'),white=M('#eee8d8');
box(16,.22,14,M('#b98c65'),0,-.12,0);
for(let x=-7.5;x<8;x+=1.5)for(let z=-6.5;z<7;z+=1.5)box(1.46,.018,1.46,M((Math.round(x+z))%2===0?'#d6b58d':'#cda77b'),x,-.002,z);
box(16,6,.22,wall,0,3,-6.9);box(16,6,.22,cream,0,3,6.9);box(.22,6,14,wall,-7.9,3,0);box(.22,6,14,wall,7.9,3,0);
// Louvre window and slats
box(3.8,2.35,.14,wood,0,3.45,-6.75);box(3.5,2.05,.05,M('#a9c7c3'),0,3.45,-6.64);
for(let i=0;i<7;i++)box(3.45,.09,.13,M('#d7d0b9'),0,2.65+i*.27,-6.53,-.12);
box(.12,2.1,.12,wood,0,3.45,-6.48);box(3.8,.12,.2,wood,0,4.64,-6.55);
// Wooden table
box(3.25,.18,2.15,oak,0,1.55,0);
for(const x of [-1.35,1.35])for(const z of [-.82,.82])box(.16,1.5,.16,wood,x,.78,z);
box(2.8,.12,.12,wood,0,.75,0);
// Plastic chairs with slatted backs
function chair(x,z,rot,color){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);const p=M(color);
let s=new THREE.Mesh(new THREE.BoxGeometry(1.15,.14,1),p);s.position.set(0,.92,0);s.castShadow=true;g.add(s);
let b=new THREE.Mesh(new THREE.BoxGeometry(1.12,1.05,.13),p);b.position.set(0,1.48,-.43);b.castShadow=true;g.add(b);
for(let lx of [-.46,.46])for(let lz of [-.37,.37]){let l=new THREE.Mesh(new THREE.BoxGeometry(.11,.9,.11),p);l.position.set(lx,.45,lz);g.add(l)}
for(let y=1.22;y<1.85;y+=.22){let sl=new THREE.Mesh(new THREE.BoxGeometry(.78,.045,.15),M('#e8d9c4'));sl.position.set(0,y,-.35);g.add(sl)}}
chair(-2.55,.15,.2,'#287e78');chair(2.55,.15,-.2,'#c65c38');
// Labelled tins
function tin(x,z,color,label,sub){cyl(.31,.31,.82,M(color,.45,.18),x,2.06,z,48);cyl(.325,.325,.09,M('#c9bda3',.35,.55),x,2.51,z,48);cyl(.325,.325,.07,M('#c9bda3',.35,.55),x,1.63,z,48);
let c=document.createElement('canvas');c.width=512;c.height=256;let ctx=c.getContext('2d');ctx.fillStyle=label==='MILO'?'#145d35':'#f8f0dc';ctx.fillRect(0,0,512,256);ctx.fillStyle=label==='MILO'?'#fff2a5':'#365a46';ctx.textAlign='center';ctx.font='bold 94px Arial';ctx.fillText(label,256,125);ctx.font='bold 34px Arial';ctx.fillText(sub,256,190);
let t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;let sign=new THREE.Mesh(new THREE.PlaneGeometry(.52,.37),new THREE.MeshBasicMaterial({map:t}));sign.position.set(x,2.08,z+.317);scene.add(sign)}
tin(-.75,-.22,'#168044','MILO','CHOCOLATE MALT');tin(.72,-.22,'#e8e2d1','MILK','POWDERED MILK');
// Two cups with tea and handles
function cup(x,z){cyl(.22,.28,.32,white,x,1.82,z,40);cyl(.205,.205,.025,M('#5b3827'),x,2,z,40);let h=new THREE.Mesh(new THREE.TorusGeometry(.13,.035,12,28,Math.PI*1.75),white);h.position.set(x+.27,1.85,z);h.rotation.z=Math.PI/2;scene.add(h)}
cup(-.15,.55);cup(.55,.55);
// Chin-chin plate and patterned Ankara cloth
cyl(.36,.36,.045,M('#f3ead7'),0,1.68,-.68,48);for(let i=0;i<5;i++)ball(.075,M('#c58a43'),-.15+(i%3)*.13,1.77,-.7+Math.floor(i/3)*.13,.9,.65,.8);
box(.55,.025,.4,M('#d34d3d'),1.1,.66,.72,0,.12,.08);for(let i=0;i<4;i++)box(.06,.028,.42,M(i%2?'#e6c75e':'#244f43'),.9+i*.12,.68,.72,0,.12,.08);
// Potted plant
cyl(.32,.42,.55,M('#ad6b45'),-5,.28,-4.8,32);for(let i=0;i<9;i++){let a=i*Math.PI*2/9,h=.9+(i%3)*.18;let l=ball(.12,M(i%2?'#477a45':'#668d4f'),-5+Math.cos(a)*.38,.72+h/2,-4.8+Math.sin(a)*.38,.65,h*2,.45);l.rotation.z=-Math.cos(a)*.35}
// Small Lagos skyline wall art
box(1.65,1.1,.08,wood,5.65,3.65,-6.72);box(1.48,.92,.025,M('#f1d9a8'),5.65,3.65,-6.66);
for(let i=0;i<5;i++){let h=.25+(i%3)*.13;box(.16,h,.03,M(i%2?'#b75d3d':'#547b70'),5.1+i*.26,3.25+h/2,-6.62)}
cyl(.05,.05,.75,dark,0,5.3,-1.2,16);cyl(.42,.12,.28,M('#d5a24d'),0,4.85,-1.2,32);
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
